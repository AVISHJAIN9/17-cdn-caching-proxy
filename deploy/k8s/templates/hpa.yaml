{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.fullnameOverride | default "cdn-proxy" }}-hpa
  labels:
    app.kubernetes.io/name: cdn-caching-proxy
    app.kubernetes.io/instance: {{ .Release.Name | default "cdn-proxy" }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ .Values.fullnameOverride | default "cdn-proxy" }}
  minReplicas: {{ .Values.autoscaling.minReplicas | default 3 }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 80 }}
{{- end }}
