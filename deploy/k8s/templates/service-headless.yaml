apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride | default "cdn-proxy" }}-headless
  labels:
    app.kubernetes.io/name: cdn-caching-proxy
    app.kubernetes.io/instance: {{ .Release.Name | default "cdn-proxy" }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cdn-caching-proxy
    app.kubernetes.io/instance: {{ .Release.Name | default "cdn-proxy" }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9090
      targetPort: 9090
