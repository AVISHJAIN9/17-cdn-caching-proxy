services:
  origin:
    image: node:20.18.0-alpine3.20
    container_name: cdn-origin-test
    command: >
      node -e "
        const http = require('http');
        const server = http.createServer((req, res) => {
          if (req.url === '/health') {
            res.writeHead(200, { 'content-type': 'text/plain' });
            res.end('OK');
            return;
          }
          res.writeHead(200, {
            'content-type': 'application/json',
            'cache-control': 'public, max-age=60',
            'etag': '\"origin-static-v1\"'
          });
          res.end(JSON.stringify({ status: 'ok', time: Date.now(), origin: 'cdn-origin-test' }));
        });
        server.listen(8000, '0.0.0.0');
      "
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 5s
      timeout: 2s
      retries: 3
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdn-caching-proxy:1.0.0
    container_name: cdn-proxy
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - PORT=8080
      - ADMIN_PORT=9090
      - CACHE_DIR=/var/cache/cdn
      - ORIGIN_URL=http://origin:8000
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - cache_data:/var/cache/cdn
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
    depends_on:
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cdn-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cache_data:
    driver: local
